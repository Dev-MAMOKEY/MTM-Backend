spring:
  application:
    name: mtm

  docker:
    compose:
      enabled: false

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT 설정
custom:
  jwt:
    secret-key: ${JWT_SECRET}
    access-exp-min: ${JWT_ACCESS_EXP_MIN}
    refresh-exp-day: ${JWT_REFRESH_EXP_DAY}

# Swagger 설정
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    default-consumes-media-type: application/json
    default-produces-media-type: application/json

# AWS
aws:
  region: ap-northeast-2
  s3:
    bucket: mtm-images-260811

# 이미지 생성 공급자 — NONE / GEMINI / OPENAI
image-generation:
  provider: ${IMAGE_GENERATION_PROVIDER:NONE}

# Gemini 이미지 생성
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash-image}

# OpenAI 이미지 생성
openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_IMAGE_MODEL:gpt-image-2}
