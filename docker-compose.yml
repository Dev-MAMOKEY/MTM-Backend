# 배포용 — 서버에서 이미지를 받아 실행한다.
# 컨테이너가 앱 하나뿐이라 오케스트레이션이 목적이 아니라,
# 실행 옵션(포트·환경변수·재시작 정책)을 파일로 고정하려는 것이다.
services:
  app:
    # 이미지 주소는 .env의 DOCKER_IMAGE로 주입한다.
    # 설정이 없으면 엉뚱한 이미지를 받지 않도록 기동 자체를 막는다.
    image: ${DOCKER_IMAGE}
    container_name: mtm
    ports:
      - "8080:8080"
    # 서버 레포 루트의 .env를 그대로 주입한다. 이미지에는 시크릿이 들어 있지 않다.
    # AWS 자격증명은 넣지 않는다 — EC2 IAM 역할로 자동 주입된다.
    env_file:
      - .env
    # 서버 재부팅이나 컨테이너 비정상 종료 시 자동으로 다시 띄운다.
    # (수동으로 docker compose down 한 경우에는 다시 뜨지 않는다)
    restart: unless-stopped
    # 로그가 무한히 쌓여 디스크를 채우는 것을 막는다
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"